<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Name · GiftExchange</title><style>:root{--ink:#16231d;--cream:#f5efe4;--terr:#c95e42;--sage:#789080;--line:#d8cfc0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial}.wrap{width:min(720px,calc(100% - 38px));margin:auto}.logo{display:inline-block;margin:42px 0 90px;font:700 23px Georgia}.logo i,h1 i{color:var(--terr)}a{text-decoration:none;color:inherit}.k{font-size:11px;letter-spacing:2.3px;font-weight:800;color:var(--sage)}h1{font:normal clamp(54px,8vw,80px)/.9 Georgia;margin:18px 0 22px;letter-spacing:-4px}.lead{font-size:18px;line-height:1.6;color:#5e6963}.panel{border-top:1px solid var(--line);padding-top:30px;margin-top:35px}select{width:100%;padding:17px;border:1px solid var(--line);background:#fffaf1;font-size:16px}.btn{margin-top:18px;background:var(--ink);color:white;border:0;padding:17px 22px;font-weight:800;cursor:pointer}.reveal{margin-top:25px;width:100%;padding:55px 20px;border:1px dashed var(--terr);background:#fff8ef;font:28px Georgia;cursor:pointer}.card{margin-top:25px;background:var(--ink);color:white;text-align:center;padding:55px 25px}.card small{letter-spacing:2px}.card strong{display:block;font:56px Georgia;color:#efba6e;margin:18px}.card span{color:#c1cbc5}.wait{padding:25px;border:1px solid var(--line);background:#faf6ee;margin-top:30px;line-height:1.6}</style></head><body><main class="wrap"><a class="logo" href="../">Gift<i>Exchange</i></a><div id="app"></div></main><script>
const code=new URLSearchParams(location.search).get('code')||'',raw=localStorage.getItem('gift-exchange-'+code),app=document.querySelector('#app');if(!raw){app.innerHTML='<div class="k">INVITATION</div><h1>Exchange<br><i>not found.</i></h1><p class="lead">Open your original invite link or ask the organizer to resend it.</p>'}else{const x=JSON.parse(raw),a=JSON.parse(localStorage.getItem('gift-assignments-'+code)||'null');app.innerHTML='<div class="k">PRIVATE ASSIGNMENT</div><h1>Click here to<br><i>get your name.</i></h1><p class="lead">Choose yourself first. Your assignment stays hidden until you reveal it.</p><div class="panel"><select id="me"><option value="">I am...</option>'+x.people.map(p=>'<option>'+p.name+'</option>').join('')+'</select><div id="next"></div></div>';document.querySelector('#me').onchange=ev=>{const me=ev.target.value,n=document.querySelector('#next');if(!me){n.innerHTML='';return}if(!a){n.innerHTML='<div class="wait"><b>Names haven’t been drawn yet.</b><br>The organizer still needs to complete the draw.</div>';return}n.innerHTML='<button class="reveal" id="reveal">Click to reveal my person ✦</button>';document.querySelector('#reveal').onclick=()=>n.innerHTML='<div class="card"><small>'+me.toUpperCase()+', YOU ARE GIFTING</small><strong>'+a[me]+'</strong><span>Keep it secret. Make it good.</span></div>'}}}
</script></body></html>
