<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Gift · GiftExchange</title><style>
:root{--ink:#16231d;--cream:#f5efe4;--terr:#c95e42;--sage:#789080;--line:#d8cfc0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(760px,calc(100% - 38px));margin:auto}.logo{display:inline-block;margin:42px 0 85px;font:700 23px Georgia,serif}.logo i,h1 i{color:var(--terr)}a{text-decoration:none;color:inherit}.k{font-size:11px;letter-spacing:2.3px;font-weight:800;color:var(--sage)}h1{font:normal clamp(50px,8vw,76px)/.92 Georgia,serif;margin:18px 0 22px;letter-spacing:-3px}.lead{font-size:18px;line-height:1.6;color:#5e6963}.panel{border-top:1px solid var(--line);padding-top:30px;margin-top:35px}select,input{width:100%;padding:16px;border:1px solid var(--line);background:#fffaf1;font-size:16px}.btn{display:inline-block;margin-top:18px;background:var(--ink);color:white;border:0;padding:16px 21px;font-weight:800;cursor:pointer}.reveal{margin-top:25px;width:100%;padding:55px 20px;border:1px dashed var(--terr);background:#fff8ef;font:28px Georgia,serif;cursor:pointer}.card{margin-top:25px;background:var(--ink);color:white;text-align:center;padding:55px 25px}.card small{letter-spacing:2px}.card strong{display:block;font:56px Georgia,serif;color:#efba6e;margin:18px}.card span{color:#c1cbc5}.wait{padding:25px;border:1px solid var(--line);background:#faf6ee;margin-top:30px;line-height:1.6}.finder{margin-top:26px;padding:28px;border:1px solid var(--line);background:#faf6ee}.finder h2{font:36px Georgia,serif;margin:8px 0 12px}.q{margin:22px 0}.q label{display:block;font-size:11px;letter-spacing:1.5px;font-weight:800;margin-bottom:9px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fffaf1;padding:10px 13px;cursor:pointer;border-radius:99px}.chip.on{background:var(--ink);color:white;border-color:var(--ink)}.ideas{display:grid;gap:12px;margin-top:24px}.idea{border:1px solid var(--line);background:#fffaf1;padding:18px}.idea b{display:block;font:22px Georgia,serif;margin-bottom:7px}.idea p{margin:0;color:#647069;line-height:1.5}.budget{font-size:13px;color:var(--sage);font-weight:800}
</style></head><body><main class="wrap"><a class="logo" href="../">Gift<i>Exchange</i></a><div id="app"></div></main><script>
(function(){var code=new URLSearchParams(location.search).get("code")||"",raw=localStorage.getItem("gift-exchange-"+code),app=document.getElementById("app");if(!raw){app.innerHTML='<div class="k">INVITATION</div><h1>Exchange<br><i>not found.</i></h1><p class="lead">Open your original invitation or ask the organizer to resend it.</p>';return}var x=JSON.parse(raw),assign=JSON.parse(localStorage.getItem("gift-assignments-"+code)||"null");app.innerHTML='<div class="k">PRIVATE ASSIGNMENT</div><h1>Click here to<br><i>get your name.</i></h1><p class="lead">Choose yourself first. Your assignment stays hidden until you reveal it.</p><div class="panel"><select id="me"><option value="">I am...</option>'+x.people.map(function(p){return "<option>"+esc(p.name)+"</option>"}).join("")+'</select><div id="next"></div></div>';document.getElementById("me").onchange=function(ev){var me=ev.target.value,n=document.getElementById("next");if(!me){n.innerHTML="";return}if(!assign){n.innerHTML='<div class="wait"><b>Names haven’t been drawn yet.</b><br>The organizer still needs to complete the draw.</div>';return}n.innerHTML='<button class="reveal" id="reveal">Click to reveal my person ✦</button>';document.getElementById("reveal").onclick=function(){showReveal(me,assign[me])}};
function showReveal(me,person){var n=document.getElementById("next");n.innerHTML='<div class="card"><small>'+esc(me.toUpperCase())+', YOU ARE GIFTING</small><strong>'+esc(person)+'</strong><span>Keep it secret. Make it good.</span></div><div class="finder"><div class="k">GIFT FINDER</div><h2>Need help with '+esc(person)+'?</h2><p class="lead">Answer a few quick questions and we’ll turn them into gift ideas.</p><p class="budget">Exchange budget: $'+esc(x.budget)+'</p><div class="q"><label>HOW OLD ARE THEY?</label><select id="age"><option>Child</option><option>Teen</option><option selected>20–39</option><option>40–59</option><option>60+</option></select></div><div class="q"><label>WHAT ARE THEY INTO? · PICK UP TO 3</label><div class="chips" id="interests"></div></div><div class="q"><label>WHAT ARE THEY LIKE?</label><div class="chips" id="traits"></div></div><div class="q"><label>ANYTHING TO AVOID? · OPTIONAL</label><input id="avoid" placeholder="Clothes, alcohol, fragrances…"></div><button class="btn" id="ideasBtn">Generate gift ideas →</button><button class="chip" style="margin-left:8px" id="surprise">Surprise me</button><div class="ideas" id="ideas"></div></div>';chips("interests",["Gaming","Tech","Sports","Outdoors","Music","Food","Books","Fitness","Art","Travel"]);chips("traits",["Practical","Creative","Techy","Outdoorsy","Gamer","Foodie","Stylish","Sentimental"],1);document.getElementById("ideasBtn").onclick=generate;document.getElementById("surprise").onclick=function(){generate(true)}}
function chips(id,vals,max){var box=document.getElementById(id);box.innerHTML=vals.map(function(v){return '<button class="chip" type="button">'+v+'</button>'}).join("");Array.from(box.children).forEach(function(b){b.onclick=function(){if(max===1)Array.from(box.children).forEach(function(z){z.classList.remove("on")});if(!b.classList.contains("on")&&(!max||box.querySelectorAll(".on").length<max))b.classList.add("on");else if(max!==1)b.classList.remove("on")}})}
function picked(id){return Array.from(document.querySelectorAll("#"+id+" .on")).map(function(b){return b.textContent})}
function generate(surprise){var ints=picked("interests"),trait=picked("traits")[0]||"",age=document.getElementById("age").value,budget=Number(x.budget)||50;if(surprise&&!ints.length)ints=["Food","Music","Travel"].sort(function(){return Math.random()-.5}).slice(0,2);var pool={Gaming:["A game-themed desk accessory","A highly rated co-op or party game","A collectible from a favorite game"],Tech:["A compact wireless charging accessory","A useful smart-home accessory","A quality everyday tech organizer"],Sports:["Team or sport-themed gear","Tickets or an experience tied to their sport","A quality recovery or training accessory"],Outdoors:["An insulated bottle or travel mug","A compact outdoor day-pack accessory","A local outdoor experience"],Music:["A vinyl record or artist merchandise","A compact Bluetooth speaker","Tickets or a music experience"],Food:["A specialty snack or tasting box","A quality kitchen or grilling accessory","A gift card to a favorite local restaurant"],Books:["A special edition book in their favorite genre","A reading light or book accessory","A bookstore gift card paired with a small personal item"],Fitness:["A quality gym accessory","A recovery or mobility kit","A fitness experience or class"],Art:["A quality sketching or craft set","A print from an artist they would like","A creative workshop or experience"],Travel:["A useful travel organizer","A personalized travel keepsake","An experience for their next trip"]};var ideas=[];(ints.length?ints:["Food","Tech","Travel"]).forEach(function(k){(pool[k]||[]).slice(0,2).forEach(function(v){ideas.push({name:v,why:"Fits "+k.toLowerCase()+(trait?" and a "+trait.toLowerCase()+" personality":"")+". Look for an option around $"+budget+"."})})});ideas=ideas.slice(0,6);document.getElementById("ideas").innerHTML='<div class="k">IDEAS FOR '+esc((assign[document.getElementById("me").value]||"THEM").toUpperCase())+'</div>'+ideas.map(function(i){return '<div class="idea"><b>'+esc(i.name)+'</b><p>'+esc(i.why)+'</p></div>'}).join("")}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}})();
</script></body></html>
