<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join · GiftExchange</title><style>:root{--ink:#16231d;--cream:#f5efe4;--terr:#c95e42;--sage:#789080;--line:#d8cfc0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial}.wrap{width:min(720px,calc(100% - 38px));margin:auto}a{text-decoration:none;color:inherit}.logo{display:inline-block;margin:42px 0 90px;font:700 23px Georgia}.logo i,h1 i{color:var(--terr)}.k{font-size:11px;letter-spacing:2.3px;font-weight:800;color:var(--sage)}h1{font:normal clamp(54px,8vw,80px)/.9 Georgia;margin:18px 0 22px;letter-spacing:-4px}.lead{font-size:18px;line-height:1.6;color:#5e6963}form{border-top:1px solid var(--line);padding-top:30px;margin-top:35px}label{display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:1px;font-weight:800}input{padding:17px;border:1px solid var(--line);background:#fffaf1;font-size:20px;letter-spacing:4px;text-transform:uppercase}.btn{margin-top:20px;background:var(--ink);color:white;border:0;padding:17px 22px;font-weight:800;cursor:pointer}.auto{margin-top:12px;color:var(--sage);font-size:13px;font-weight:700}</style></head><body><main class="wrap"><a class="logo" href="../">Gift<i>Exchange</i></a><div class="k">YOU&apos;RE INVITED</div><h1>Join the<br><i>exchange.</i></h1><p class="lead">Your invite code is ready. Continue to enter the exchange.</p><form id="join"><label>INVITE CODE<input id="code" required maxlength="12" placeholder="ABC123"></label><div class="auto" id="auto"></div><button class="btn">Continue →</button></form></main><script>const q=new URLSearchParams(location.search).get('code')||'';const input=document.querySelector('#code');if(q){input.value=q.toUpperCase();document.querySelector('#auto').textContent='Code filled from your invitation link.'}document.querySelector('#join').onsubmit=e=>{e.preventDefault();const c=input.value.trim().toUpperCase();location.href
