<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exchange · GiftExchange</title><style>:root{--ink:#16231d;--cream:#f5efe4;--terr:#c95e42;--sage:#789080;--line:#d8cfc0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial}.wrap{width:min(1100px,calc(100% - 38px));margin:auto}nav{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font:700 23px Georgia}.logo i,h1 i{color:var(--terr)}a{text-decoration:none;color:inherit}.pill{border:1px solid var(--line);padding:8px 13px;border-radius:99px;font-size:12px;letter-spacing:2px}.main{padding:70px 0}.k{font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--sage)}h1{font:64px Georgia;margin:15px 0}.meta{display:flex;gap:30px;border-bottom:1px solid var(--line);padding-bottom:35px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:25px;margin-top:30px}.panel{background:#faf6ee;border:1px solid var(--line);padding:28px}.person{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:white;font:19px Georgia}.btn{background:var(--ink);color:white;border:0;padding:16px 21px;font-weight:800;cursor:pointer}.draw h2{font:36px Georgia}.draw p{color:#68736d;line-height:1.6}.draw select{width:100%;padding:14px;border:1px solid var(--line);background:white;margin:15px 0}.reveal{width:100%;padding:35px;border:1px dashed var(--terr);background:#fff8ef;font:24px Georgia;cursor:pointer}.card{background:var(--ink);color:white;text-align:center;padding:45px 20px;margin-top:15px}.card strong{display:block;font:50px Georgia;color:#efba6e;margin:14px}.empty{padding:100px 0;text-align:center}@media(max-width:750px){.grid{grid-template-columns:1fr}.meta{flex-direction:column;gap:8px}h1{font-size:48px}}</style></head><body><nav class="wrap"><a class="logo" href="../">Gift<i>Exchange</i></a><span class="pill" id="pill"></span></nav><main class="wrap main" id="app"></main><script>
const code=new URLSearchParams(location.search).get('code'),raw=localStorage.getItem('gift-exchange-'+code),app=document.querySelector('#app');if(!raw){app.innerHTML='<div class="empty"><h1>Exchange not found.</h1><p>This code is not stored on this device.</p><a href="../create/">Create an exchange</a></div>'}else{const x=JSON.parse(raw);document.querySelector('#pill').textContent=x.code;app.innerHTML='<div class="k">YOUR EXCHANGE</div><h1>'+x.name+'</h1><div class="meta"><span><b>$'+x.budget+'</b> budget</span><span><b>'+x.date+'</b> gift date</span><span><b>'+x.people.length+'</b> people</span></div><div class="grid"><section class="panel"><div class="k">PARTICIPANTS</div><div id="plist"></div></section><section class="panel draw"><div class="k">PRIVATE DRAW</div><h2 id="title">Ready to draw names?</h2><p>Everyone gets exactly one person. Nobody can draw themselves.</p><div id="draw"><button class="btn" id="drawBtn">Draw names ✦</button></div></section></div>';document.querySelector('#plist').innerHTML=x.people.map(p=>'<div class="person"><span class="avatar">'+p.name[0].toUpperCase()+'</span><b>'+p.name+'</b></div>').join('');document.querySelector('#drawBtn').onclick=()=>{let names=x.people.map(p=>p.name),r;do{r=[...names].sort(()=>Math.random()-.5)}while(names.some((n,i)=>n===r[i]));const a={};names.forEach((n,i)=>a[n]=r[i]);document.querySelector('#title').textContent='Assignments ready.';document.querySelector('#draw').innerHTML='<select id="who"><option value="">Preview as participant</option>'+names.map(n=>'<option>'+n+'</option>').join('')+'</select><div id="result"></div>';document.querySelector('#who').onchange=e=>{const n=e.target.value;document.querySelector('#result').innerHTML=n?'<button class="reveal" id="reveal">Tap to reveal</button>':'';if(n)document.querySelector('#reveal').onclick=()=>document.querySelector('#result').innerHTML='<div class="card"><small>'+n.toUpperCase()+', YOU ARE GIFTING</small><strong>'+a[n]+'</strong><span>Keep it secret. Make it good.</span></div>'}}}}
</script></body></html>
