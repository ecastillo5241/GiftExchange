<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exchange · GiftExchange</title><style>:root{--ink:#16231d;--cream:#f5efe4;--terr:#c95e42;--sage:#789080;--line:#d8cfc0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 38px));margin:auto}nav{height:84px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font:700 23px Georgia,serif}.logo i{color:var(--terr)}a{text-decoration:none;color:inherit}.pill{border:1px solid var(--line);padding:8px 13px;border-radius:99px;font-size:12px;letter-spacing:2px}.main{padding:70px 0}.k{font-size:11px;letter-spacing:2.2px;font-weight:800;color:var(--sage)}h1{font:64px Georgia,serif;margin:15px 0}.meta{display:flex;gap:30px;border-bottom:1px solid var(--line);padding-bottom:35px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.soft,.btn{padding:13px 16px;font-weight:800;cursor:pointer}.soft{border:1px solid var(--line);background:#fffaf1}.btn{background:var(--ink);color:white;border:0}.status{font-size:13px;color:var(--sage);font-weight:800}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:25px;margin-top:30px}.panel{background:#faf6ee;border:1px solid var(--line);padding:28px}.person{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:white;font:19px Georgia}.draw h2{font:36px Georgia}.draw p{color:#68736d;line-height:1.6}.empty{padding:100px 0;text-align:center}@media(max-width:750px){.grid{grid-template-columns:1fr}.meta{flex-direction:column;gap:8px}h1{font-size:48px}}</style></head><body><nav class="wrap"><a class="logo" href="../">Gift<i>Exchange</i></a><span class="pill" id="pill"></span></nav><main class="wrap main" id="app"></main><script>
(function(){var params=new URLSearchParams(location.search);var code=params.get("code")||"";var raw=localStorage.getItem("gift-exchange-"+code);var app=document.getElementById("app");if(!raw){app.innerHTML='<div class="empty"><h1>Exchange not found.</h1><p>Open your original invitation or create a new exchange.</p></div>';return}var x=JSON.parse(raw);document.getElementById("pill").textContent=x.code;var people=x.people||[];app.innerHTML='<div class="k">ORGANIZER DASHBOARD</div><h1>'+esc(x.name)+'</h1><div class="meta"><span><b>$'+esc(x.budget)+'</b> budget</span><span><b>'+esc(x.date)+'</b> gift date</span><span><b>'+people.length+'</b> people</span></div><div class="tools"><button class="soft" id="copyInvite">Copy invite link</button><button class="soft" id="copyCode">Copy code</button><a class="soft" href="../participant/?code='+encodeURIComponent(x.code)+'">Click here to get your name</a></div><div class="status" id="status"></div><div class="grid"><section class="panel"><div class="k">PARTICIPANTS</div><div id="plist"></div></section><section class="panel draw"><div class="k">PRIVATE DRAW</div><h2 id="drawTitle"></h2><div id="drawArea"></div></section></div>';document.getElementById("plist").innerHTML=people.map(function(p){return '<div class="person"><span class="avatar">'+esc(p.name.charAt(0).toUpperCase())+'</span><b>'+esc(p.name)+'</b></div>'}).join("");document.getElementById("copyInvite").onclick=function(){navigator.clipboard.writeText(new URL("../join/?code="+encodeURIComponent(x.code),location.href).href)};document.getElementById("copyCode").onclick=function(){navigator.clipboard.writeText(x.code)};render();
function render(){var saved=localStorage.getItem("gift-assignments-"+x.code);var title=document.getElementById("drawTitle"),area=document.getElementById("drawArea"),status=document.getElementById("status");if(saved){title.textContent="Names drawn ✓";status.textContent="Private assignments are ready.";area.innerHTML='<p>Each participant can now reveal only their own person.</p><a class="btn" href="../participant/?code='+encodeURIComponent(x.code)+'">Get my name →</a>';return}title.textContent="Ready to draw names?";status.textContent="Exchange ready · Draw names when your group is set.";area.innerHTML='<p>Everyone gets exactly one person. Nobody can draw themselves.</p><button class="btn" id="drawBtn">Draw names ✦</button>';document.getElementById("drawBtn").onclick=draw}
function draw(){var names=people.map(function(p){return p.name});if(names.length<3)return;var r,ok=false;while(!ok){r=names.slice().sort(function(){return Math.random()-.5});ok=names.every(function(n,i){return n!==r[i]})}var a={};names.forEach(function(n,i){a[n]=r[i]});localStorage.setItem("gift-assignments-"+x.code,JSON.stringify(a));render()}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}})();
</script></body></html>
